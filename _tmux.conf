set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Change the prefix from C-b to C-q.
set -g prefix C-q
unbind-key C-b

# Reduce delay after prefix/key sequences.
set -sg escape-time 0

setw -g mouse on
set -g status-position top

# Use vi-style keys in copy mode.
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Clipboard integration priority: WSL2 -> macOS -> Linux/X11.
# Only the first available backend is used.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'if command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v xclip >/dev/null 2>&1; then xclip -i -sel clip >/dev/null; else cat >/dev/null; fi'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'if command -v clip.exe >/dev/null 2>&1; then clip.exe; elif command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v xclip >/dev/null 2>&1; then xclip -i -sel clip >/dev/null; else cat >/dev/null; fi'

set -g status-fg "#0B2C46"
set -g status-bg white

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r < resize-pane -L 5
bind -r - resize-pane -D 5
bind -r + resize-pane -U 5
bind -r > resize-pane -R 5

set -g history-limit 1000000

bind c new-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind '"' split-window -vc "#{pane_current_path}"

set -g pane-border-status top
set -g pane-border-format " #{pane_index} : #T "
set -g pane-active-border-style "bg=brightgreen,fg=#0B2C46"
set -g pane-border-style "bg=#0B2C46,fg=brightgreen"
set -g window-style "bg=#0B2C46"
